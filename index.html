<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live AI Trading Terminal</title>
  <script src="https://tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 transition-colors duration-200">

  <div class="w-full max-w-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-2xl transition-colors duration-200">
    
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-4 mb-6">
      <div>
        <h1 class="text-xl font-bold tracking-wide text-indigo-600 dark:text-indigo-400">Trading Live Terminal</h1>
        <span class="text-[10px] text-slate-400 font-medium block mt-0.5">Shark Cloud Interface Pipeline</span>
      </div>
      
      <!-- Theme Switcher Controls -->
      <div class="flex items-center gap-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl border border-slate-200 dark:border-slate-700">
        <button onclick="changeTheme('light')" id="btn-light" class="text-xs px-2.5 py-1.5 rounded-lg font-medium transition">☀️ Light</button>
        <button onclick="changeTheme('dark')" id="btn-dark" class="text-xs px-2.5 py-1.5 rounded-lg font-medium transition">🌙 Dark</button>
        <button onclick="changeTheme('system')" id="btn-system" class="text-xs px-2.5 py-1.5 rounded-lg font-medium transition">💻 System</button>
      </div>
    </div>

    <!-- Dropdowns -->
    <div class="grid grid-cols-2 gap-4 mb-6">
      <div>
        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Asset Instrument</label>
        <select id="instrument-select" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl p-3 text-slate-900 dark:text-white focus:outline-none cursor-pointer font-medium">
          <option value="BINANCE:BTCUSDT">BTCUSDT (Bitcoin)</option>
          <option value="BINANCE:ETHUSDT">ETHUSDT (Ethereum)</option>
          <option value="BINANCE:SOLUSDT">SOLUSDT (Solana)</option>
          <option value="FX_IDC:XAUUSD">XAUUSD (Gold)</option>
          <option value="FX_IDC:XAGUSD">XAGUSD (Silver)</option>
          <option value="TVC:CL1!">CLUSDT (Crude Oil)</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Time Frame</label>
        <select id="timeframe-select" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl p-3 text-slate-900 dark:text-white focus:outline-none cursor-pointer font-medium">
          <option value="3">3m</option>
          <option value="15" selected>15m</option>
          <option value="30">30m</option>
          <option value="60">1h</option>
          <option value="240">4h</option>
        </select>
      </div>
    </div>

    <!-- Live Interface Widget Space -->
    <div class="w-full h-96 rounded-xl overflow-hidden bg-slate-100 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 shadow-inner" id="widget-container">
      <div id="tradingview-pane" class="w-full h-full"></div>
    </div>

    <p class="text-[10px] text-center text-slate-400 mt-6 tracking-wide">Cloud Secure Interface • Live Trading Feed Active</p>
  </div>

  <!-- TradingView Integration Script -->
  <script type="text/javascript" src="https://tradingview.com"></script>
  
  <script type="text/javascript">
    let activeTheme = 'dark';

    function changeTheme(mode) {
      const root = document.documentElement;
      let chosen = mode;
      
      if (mode === 'system') {
        chosen = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }

      if (chosen === 'dark') {
        root.classList.add('dark');
      } else {
        root.classList.remove('dark');
      }

      activeTheme = chosen;

      ['light', 'dark', 'system'].forEach(m => {
        const btn = document.getElementById(`btn-${m}`);
        if (m === mode) {
          btn.className = "text-xs px-2.5 py-1.5 rounded-lg font-semibold bg-indigo-600 text-white shadow";
        } else {
          btn.className = "text-xs px-2.5 py-1.5 rounded-lg font-medium text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200";
        }
      });

      renderChart();
    }

    function renderChart() {
      const symbol = document.getElementById('instrument-select').value;
      const interval = document.getElementById('timeframe-select').value;

      if (typeof TradingView !== 'undefined') {
        new TradingView.MediumWidget({
          "symbols": [[symbol]],
          "chartOnly": false,
          "width": "100%",
          "height": "100%",
          "locale": "en",
          "colorTheme": activeTheme,
          "gridLineColor": "rgba(42, 46, 57, 0)",
          "trendLineColor": "#4f46e5",
          "fontColor": "#787b86",
          "underLineColor": "rgba(79, 70, 229, 0.1)",
          "underLineBottomColor": "rgba(79, 70, 229, 0)",
          "isTransparent": true,
          "container_id": "tradingview-pane"
        });
      }
    }

    document.getElementById('instrument-select').addEventListener('change', renderChart);
    document.getElementById('timeframe-select').addEventListener('change', renderChart);

    window.onload = function() {
      changeTheme('dark');
    };
  </script>
</body>
</html>
